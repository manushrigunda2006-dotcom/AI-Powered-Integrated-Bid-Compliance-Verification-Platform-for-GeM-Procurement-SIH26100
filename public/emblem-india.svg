  <!-- Abacus (Base Platform) -->
  <rect x="20" y="80" width="60" height="4" rx="1.5" />
  
  <!-- Abacus Middle Band with Ashoka Chakra -->
  <rect x="22" y="85" width="56" height="15" rx="1" fill="#475569" />
  
  <!-- Central Ashoka Chakra -->
  <circle cx="50" cy="92.5" r="6" fill="#ffffff" />
  <circle cx="50" cy="92.5" r="5" fill="#334155" />
  <circle cx="50" cy="92.5" r="2" fill="#ffffff" />
  <circle cx="50" cy="92.5" r="1" fill="#334155" />
