    <path d="M37 17 C34 17 31 19 30 22 C29 25 31 27 30 29 C27 29 25 31 25 34 C25 37 27 39 27 42 C24 42 22 45 23 48 C24 52 28 54 32 54 C34 54 36 53 38 51 C36 47 36 43 37 39 C36 35 36 31 37 27 Z" />
