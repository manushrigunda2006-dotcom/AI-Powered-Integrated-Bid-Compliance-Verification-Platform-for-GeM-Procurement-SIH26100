  <rect x="24" y="117.5" width="52" height="3" rx="1" />

  <!-- Satyameva Jayate Banner Base (सत्यमेव जयते) -->
  <text x="50" y="130" font-family="'Noto Sans Devanagari', 'Arial Unicode MS', sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#334155" letter-spacing="0.5">सत्यमेव जयते</text>
