  <line x1="50" y1="87.5" x2="50" y2="97.5" stroke="#ffffff" stroke-width="0.7" />
  <line x1="45" y1="92.5" x2="55" y2="92.5" stroke="#ffffff" stroke-width="0.7" />
  <line x1="46.5" y1="89" x2="53.5" y2="96" stroke="#ffffff" stroke-width="0.7" />
  <line x1="46.5" y1="96" x2="53.5" y2="89" stroke="#ffffff" stroke-width="0.7" />

