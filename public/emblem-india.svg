  <path d="M26 95 C27 93 29 91 32 91 C33 90 34 88 35 88 C36 88 36 90 35 91 C37 92 38 93 37 95 C36 96 34 96 33 95 L31 97 L29 97 L30 95 Z" fill="#ffffff" />

  <!-- Right Bull Silhouette -->
